# Secret scan configuration for .github/workflows/security-scan.yml.
# The default gitleaks rules apply. The entries below name the known non-secrets
# in this tree; anything else that matches fails the scan.
title = "verax"

[extend]
useDefault = true

[[allowlists]]
description = "Frozen ledger vectors: WebAuthn authenticatorData is public verification data, not a credential"
paths = ['''^test-vectors/v1/[^/]+/ledger/inputs\.jsonl$''']

[[allowlists]]
description = "anchor-ccf fixture ledger: authenticatorData is WebAuthn verification data and tenantKey is the SHA-256 of an issuer and subject; only those two fields, only in these files"
condition = "AND"
paths = ['''^tests/fixtures/anchor-ccf/ledger/(inputs|halt-history|memory-commits)\.jsonl$''']
regexTarget = "match"
regexes = ['''^(authenticatorData|tenantKey)"''']

[[allowlists]]
description = "Test signing keys that say so in their file name"
paths = ['''\.TEST-KEY-NOT-A-SECRET\.pem$''']
