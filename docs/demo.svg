<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 637" width="860" height="637" role="img" aria-label="verax demo: the output of one real run, played back slowly">
<title>verax demo: the output of one real run, played back slowly</title>
<style>
.m{font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;white-space:pre}
@keyframes k{0%,2.16%{opacity:0}2.76%,97%{opacity:1}100%{opacity:0}}
@keyframes b0{0%,7.57%{opacity:0}8.17%,97%{opacity:1}100%{opacity:0}}
@keyframes b1{0%,15.68%{opacity:0}16.28%,97%{opacity:1}100%{opacity:0}}
@keyframes b2{0%,23.78%{opacity:0}24.38%,97%{opacity:1}100%{opacity:0}}
@keyframes b3{0%,31.89%{opacity:0}32.49%,97%{opacity:1}100%{opacity:0}}
@keyframes b4{0%,48.65%{opacity:0}49.25%,97%{opacity:1}100%{opacity:0}}
@keyframes b5{0%,56.76%{opacity:0}57.36%,97%{opacity:1}100%{opacity:0}}
@keyframes b6{0%,64.86%{opacity:0}65.46%,97%{opacity:1}100%{opacity:0}}
@keyframes y{0%,38.38%{opacity:0}38.98%,97%{opacity:1}100%{opacity:0}}
@keyframes o{0%,41.08%{opacity:0}41.68%,97%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.m,.m tspan{animation:none!important}}
</style>
<rect x="0.5" y="0.5" width="859" height="636" rx="10" fill="#0d1117" stroke="#30363d"/>
<circle cx="22" cy="20" r="6" fill="#ff5f56"/><circle cx="42" cy="20" r="6" fill="#ffbd2e"/><circle cx="62" cy="20" r="6" fill="#27c93f"/>
<text class="m" x="22" y="52" fill="#e6edf3" style="animation:k 18.5s infinite">$ npx @verax-ai/body demo</text>
<text class="m" x="22" y="94" fill="#c9d1d9" style="animation:b0 18.5s infinite">verax demo</text>
<text class="m" x="22" y="136" fill="#c9d1d9" style="animation:b1 18.5s infinite">memory.put / memory.get</text>
<text class="m" x="22" y="157" fill="#7ee787" style="animation:b1 18.5s infinite">  allowed; two signed records</text>
<text class="m" x="22" y="199" fill="#c9d1d9" style="animation:b2 18.5s infinite">message.send -&gt; ops@blocked.test</text>
<text class="m" x="22" y="220" fill="#ff7b72" style="animation:b2 18.5s infinite">  refused egress-blocked (signed)</text>
<text class="m" x="22" y="241" fill="#8b949e" style="animation:b2 18.5s infinite">  ref 8e25a6a2-46bb-422d-9da7-b3da947d1454</text>
<text class="m" x="22" y="283" fill="#c9d1d9" style="animation:b3 18.5s infinite">spend 100 minor USD sample-merchant</text>
<text class="m" x="22" y="304" fill="#d29922" style="animation:b3 18.5s infinite">  held</text>
<text class="m" x="22" y="325" fill="#e6edf3" style="animation:b3 18.5s infinite">Approve this payment as the operator on this machine? [y/N]<tspan fill="#7ee787" style="animation:y 18.5s infinite"> y</tspan></text>
<text class="m" x="22" y="346" fill="#7ee787" style="animation:o 18.5s infinite">  approved; operator id bound on the record</text>
<text class="m" x="22" y="388" fill="#c9d1d9" style="animation:b4 18.5s infinite">audit.explain of the refuse</text>
<text class="m" x="22" y="409" fill="#c9d1d9" style="animation:b4 18.5s infinite">  finding none</text>
<text class="m" x="22" y="430" fill="#c9d1d9" style="animation:b4 18.5s infinite">  trust-root own-key</text>
<text class="m" x="22" y="451" fill="#c9d1d9" style="animation:b4 18.5s infinite">  chain and signatures read back</text>
<text class="m" x="22" y="493" fill="#8b949e" style="animation:b5 18.5s infinite">records  6</text>
<text class="m" x="22" y="514" fill="#8b949e" style="animation:b5 18.5s infinite">effects  4</text>
<text class="m" x="22" y="535" fill="#8b949e" style="animation:b5 18.5s infinite">ledger   removed on exit (run with --keep to keep it and check it with verax verify)</text>
<text class="m" x="22" y="577" fill="#8b949e" style="animation:b6 18.5s infinite">Not shown here: data masking arrives with a downstream server such as Conarium; statement</text>
<text class="m" x="22" y="598" fill="#8b949e" style="animation:b6 18.5s infinite">  reconciliation needs a real statement (verax reconcile).</text>
</svg>
