# The full suite on Windows, on a hosted runner neither party
# keeps. At the current commit the hosted run skips nothing (measured on
# the runner, none skipped); a local run without symbolic-link privilege
# skips POSIX-mode cases with a stated reason. Either way a
# green run is a smaller claim than posix-full, and it is
# counted as exactly that.
#
# This job was withheld while a fresh Windows clone was believed to fail the
# line-ending guard. That belief went stale: the guard reads the object
# store, not the working tree, and a fresh core.autocrlf=true clone was
# measured running the whole suite green before this job was added.
name: windows-full

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  suite:
    runs-on: windows-latest
    # Green hosted runs on 8 Sep 2026 finished in 2m35s–3m14s (3m0s on
    # e9173e7, 3m10s on 523f2d7). A hung `npm test` previously sat until
    # this job's 40-minute cap (cancelled at 40m11s on the #11 merge) and
    # can sit until GitHub's 6-hour cap if the job has no timeout. The
    # runner is elevated, so every test that starts the CLI first checks who
    # can change its code (one PowerShell), which made the suite longer than
    # the old 12 minutes. 30 still turns a stuck suite red instead of masking
    # a later failure. Do not skip tests or set continue-on-error.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # The hosted runner's D:\ default lets BUILTIN\Users add files. verax
      # desktop refuses a code path someone else can add to, and that refusal
      # is the right behaviour. This step gives the job the checkout an
      # operator's own clone would have. It does not loosen the product's rule.
      # The account is granted by SID, and the step prints who runs it and
      # the ACL before and after, so a later permission error has evidence.
      - name: keep the checkout writable only by this account, SYSTEM and Administrators
        shell: pwsh
        run: |
          $me = [Security.Principal.WindowsIdentity]::GetCurrent()
          "identity $($me.Name) $($me.User.Value) USERNAME=$env:USERNAME"
          whoami /groups /fo csv | Select-String 'S-1-5-32-544|S-1-5-32-545|Mandatory Label'
          icacls "$env:GITHUB_WORKSPACE\package-lock.json"
          icacls "$env:GITHUB_WORKSPACE" /inheritance:r /grant:r "*$($me.User.Value):(OI)(CI)F" "*S-1-5-18:(OI)(CI)F" "*S-1-5-32-544:(OI)(CI)F" /T /C /Q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          icacls "$env:GITHUB_WORKSPACE\package-lock.json"
          $null = [IO.File]::ReadAllBytes("$env:GITHUB_WORKSPACE\package-lock.json")
          "package-lock.json readable after the change"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm
      - name: show the line-ending and temp configuration this runner actually has
        shell: bash
        run: |
          echo "autocrlf=$(git config core.autocrlf || echo unset)"
          node -e "const {tmpdir}=require('os'); console.log('tmpdir', tmpdir());"
      - run: npm ci --ignore-scripts
      # The panel browser tests drive a real Chromium; the suite must carry it too.
      - run: npx playwright install chromium
      - run: npm test
