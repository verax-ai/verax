name: release-check
# Compares the version in the tree with npm, Docker Hub, the release tag, the
# platform table, Zenodo and the MCP registry (scripts/release-check.ts).
# Each publish is its own manual step, so one can be skipped while every file
# here still agrees; this run turns red until the missing step is done.
# Not a pull request check: a release in progress is expected to disagree.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 6 * * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
      - name: Every place names the version in the tree
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/release-check.ts
