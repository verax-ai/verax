# Full suite as a non-root user, on Linux.
#
# Do not add a Windows runner as the only full-suite job. The hosted
# Windows job skips nothing at the time of writing, but a local Windows
# run without symbolic-link privilege skips POSIX-mode cases, so a
# green Windows job alone is a smaller claim than a green POSIX job. A
# Windows job is only meaningful beside this one.
name: posix-full

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  suite:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The whole suite on macOS too; the installer e2e alone left most tests unrun there.
        os: [ubuntu-latest, macos-latest]
    # Same hang-to-red reason as windows-full. Green posix-full runs on
    # 8 Sep 2026 finished in 1m26s–2m36s (1m44s on e9173e7). 8 minutes
    # is about 3× the slowest green. Do not skip tests or set
    # continue-on-error.
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm
      - name: refuse root
        run: |
          test "$(id -u)" != "0"
          echo "uid=$(id -u) user=$(id -un)"
      - run: npm ci --ignore-scripts
      # The panel browser tests drive a real Chromium; the suite must carry it too.
      - run: npx playwright install --with-deps chromium
      - run: npm test
      # What the suite proves about the repository, this proves about the
      # tarballs: a clean install elsewhere, and the installed bin answering.
      - run: npm run pack:smoke
