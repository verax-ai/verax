# Full suite as a non-root user, on Linux.
#
# Do not add a Windows runner as the only full-suite job. The hosted
# Windows job skips nothing at the time of writing, but a local Windows
# run without symbolic-link privilege skips POSIX-mode cases, so a
# green Windows job alone is a smaller claim than a green POSIX job. A
# Windows job is only meaningful beside this one.
name: posix-full

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  suite:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The whole suite on macOS too; the installer e2e alone left most tests unrun there.
        os: [ubuntu-latest, macos-latest]
    # Same hang-to-red reason as windows-full. Green posix-full runs on
    # 8 Sep 2026 finished in 1m26s–2m36s (1m44s on e9173e7). The 8-minute
    # bound now sits on the npm test step itself, so a hung test still
    # turns red. The job bound covers a slow browser install too: on
    # 22 Oct 2026 the playwright install took 7m13s on one ubuntu runner
    # (22s–41s on green runs) and the job was cancelled before npm test
    # finished. Do not skip tests or set continue-on-error.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: refuse root
        run: |
          test "$(id -u)" != "0"
          echo "uid=$(id -u) user=$(id -un)"
      - run: npm ci --ignore-scripts
      # The panel browser tests drive a real Chromium; the suite must carry it too.
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 10
      - run: npm test
        timeout-minutes: 8
      # What the suite proves about the repository, this proves about the
      # tarballs: a clean install elsewhere, and the installed bin answering.
      - run: npm run pack:smoke
