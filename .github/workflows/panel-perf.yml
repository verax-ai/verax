name: panel-perf

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  panel-perf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run build -w @verax-ai/panel
      - run: node apps/panel/perf/measure.mjs
      - run: node apps/panel/perf/check-baseline.mjs
