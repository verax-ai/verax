name: panel-perf

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  panel-perf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run build -w @verax-ai/panel
      - run: node apps/panel/perf/measure.mjs
        env:
          # Software-GL smoke: 40 s budget, 10-frame floor. Key is gha-*.
          VERAX_PERF_BUDGET_MS: "40000"
          VERAX_PERF_MIN_FRAMES: "10"
      - run: node apps/panel/perf/check-baseline.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: panel-perf-last
          path: apps/panel/perf/last.json
          if-no-files-found: ignore
