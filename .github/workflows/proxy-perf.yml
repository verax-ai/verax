name: proxy-perf

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  proxy-perf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --experimental-strip-types packages/proxy/perf/measure.ts
      # No baseline is recorded yet, so this prints the numbers and passes. It
      # is here to collect the runner's own spread; packages/proxy/perf/README.md
      # says what turns it into a gate and what has to be true first.
      - run: node packages/proxy/perf/check.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: proxy-perf-last
          path: packages/proxy/perf/last-*.json
          if-no-files-found: ignore
