name: proxy-perf

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  proxy-perf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --experimental-strip-types packages/proxy/perf/measure.ts
      # No baseline is recorded yet, so this prints the numbers and passes. It
      # is here to collect the runner's own spread; packages/proxy/perf/README.md
      # says what turns it into a gate and what has to be true first.
      - run: node packages/proxy/perf/check.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: proxy-perf-last
          path: packages/proxy/perf/last-*.json
          if-no-files-found: ignore
