name: proxy-perf

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  proxy-perf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --experimental-strip-types packages/proxy/perf/measure.ts
      # No baseline is recorded yet, so this prints the numbers and passes. It
      # is here to collect the runner's own spread; packages/proxy/perf/README.md
      # says what turns it into a gate and what has to be true first.
      - run: node packages/proxy/perf/check.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: proxy-perf-last
          path: packages/proxy/perf/last-*.json
          if-no-files-found: ignore
