name: docker
# Builds the container image from the body version on npm, once on an amd64
# runner and once on an arm64 runner, so each architecture is built and checked
# on its own hardware rather than under emulation. On each it checks three
# things: it refuses to start without its OIDC configuration (exit 78, the
# message names the missing variables), it opens its ledger on a fresh volume
# once configured, and it does not run as root.
# confirm=publish then pushes veraxai/verax:<version>-<arch> from each runner,
# joins the two under veraxai/verax:<version> and :latest with the
# DOCKERHUB_TOKEN repository secret, checks that both architectures are there,
# and sends the page text from the tree. Nothing is pushed on a pull request.
on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".github/workflows/docker.yml"
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to push the image to Docker Hub, or "check" to build and test only'
        required: true
        default: "check"

permissions:
  contents: read

jobs:
  image:
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version from the body package
        id: v
        run: echo "version=$(node -p "require('./packages/body/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build
        run: docker build --build-arg "VERAX_VERSION=${{ steps.v.outputs.version }}" -t "veraxai/verax:${{ steps.v.outputs.version }}-${{ matrix.arch }}" .

      - name: Built for this runner's architecture
        run: test "$(docker image inspect -f '{{.Architecture}}' "veraxai/verax:${{ steps.v.outputs.version }}-${{ matrix.arch }}")" = "${{ matrix.arch }}"

      - name: Refuses to start without OIDC configuration
        run: |
          set +e
          out=$(docker run --rm "veraxai/verax:${{ steps.v.outputs.version }}-${{ matrix.arch }}" 2>&1)
          code=$?
          set -e
          echo "$out"
          test "$code" = 78
          echo "$out" | grep -q "missing VERAX_ISSUER, VERAX_JWKS_URL, or VERAX_AUDIENCE"

      # The image declares VOLUME /var/lib/verax; a fresh named volume takes the
      # directory's mode from the image, and the ledger refuses one wider than 0700.
      - name: Opens its ledger on a fresh volume
        env:
          IMAGE: veraxai/verax:${{ steps.v.outputs.version }}-${{ matrix.arch }}
        run: |
          docker volume create verax-ci-state
          policy=$(docker run --rm --entrypoint sh "$IMAGE" -c 'find /usr/local/lib/node_modules -path "*proxy/policy/default.json" | head -1')
          docker run -d --name verax-ci-body -v verax-ci-state:/var/lib/verax \
            -e VERAX_ISSUER=https://issuer.invalid -e VERAX_JWKS_URL=https://issuer.invalid/jwks \
            -e VERAX_AUDIENCE=https://verax.invalid/mcp -e VERAX_TLS_TERMINATED=1 \
            -e VERAX_POLICY_FILE="$policy" "$IMAGE" serve
          ok=1
          for _ in $(seq 1 30); do
            if docker logs verax-ci-body 2>&1 | grep -q "^listening "; then ok=0; break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' verax-ci-body)" != "true" ]; then break; fi
            sleep 1
          done
          docker logs verax-ci-body 2>&1 | tail -5
          docker rm -f verax-ci-body
          exit "$ok"

      - name: Does not run as root
        run: test "$(docker run --rm --entrypoint id "veraxai/verax:${{ steps.v.outputs.version }}-${{ matrix.arch }}" -u)" != "0"

      - name: Push this architecture to Docker Hub
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'publish' }}
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE: veraxai/verax:${{ steps.v.outputs.version }}-${{ matrix.arch }}
        run: |
          test -n "$DOCKERHUB_TOKEN" || { echo "the DOCKERHUB_TOKEN secret is not set"; exit 1; }
          echo "$DOCKERHUB_TOKEN" | docker login -u veraxai --password-stdin
          docker push "$IMAGE"

  # Runs only after both architectures were built, checked and pushed.
  publish:
    needs: image
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'publish' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version from the body package
        id: v
        run: echo "version=$(node -p "require('./packages/body/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Join both architectures under the version and latest
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          test -n "$DOCKERHUB_TOKEN" || { echo "the DOCKERHUB_TOKEN secret is not set"; exit 1; }
          echo "$DOCKERHUB_TOKEN" | docker login -u veraxai --password-stdin
          docker buildx imagetools create -t "veraxai/verax:$VERSION" -t veraxai/verax:latest \
            "veraxai/verax:$VERSION-amd64" "veraxai/verax:$VERSION-arm64"

      - name: Both architectures are on Docker Hub
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          for tag in "$VERSION" latest; do
            platforms=$(docker buildx imagetools inspect "veraxai/verax:$tag" --format '{{json .Manifest}}' \
              | node -e 'let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => {
                  const m = JSON.parse(s);
                  process.stdout.write((m.manifests ?? []).map((x) => `${x.platform?.os}/${x.platform?.architecture}`).sort().join(" "));
                })')
            echo "veraxai/verax:$tag: $platforms"
            for want in linux/amd64 linux/arm64; do
              case " $platforms " in *" $want "*) ;; *) echo "veraxai/verax:$tag has no $want"; exit 1 ;; esac
            done
          done

      # The page text lives in the tree: docs/dockerhub.md is the overview and
      # the body package's description is the short line. `npm run
      # release:check` compares both with what Docker Hub shows. The token goes
      # to curl on stdin, not on its command line.
      - name: Page text on Docker Hub
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'publish' }}
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          body="$RUNNER_TEMP/dockerhub-repository.json"
          node -e '
            const fs = require("node:fs");
            const { description } = JSON.parse(fs.readFileSync("packages/body/package.json", "utf8"));
            const full_description = fs.readFileSync("docs/dockerhub.md", "utf8");
            fs.writeFileSync(process.argv[1], JSON.stringify({ description, full_description }));
          ' "$body"
          jwt=$(node -e 'process.stdout.write(JSON.stringify({ identifier: "veraxai", secret: process.env.DOCKERHUB_TOKEN }))' \
            | curl -fsS -X POST https://hub.docker.com/v2/auth/token -H 'Content-Type: application/json' --data @- \
            | node -e 'let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => process.stdout.write(JSON.parse(s || "{}").access_token ?? ""))')
          test -n "$jwt" || { echo "Docker Hub returned no access token"; exit 1; }
          echo "::add-mask::$jwt"
          printf 'header = "Authorization: Bearer %s"\n' "$jwt" \
            | curl -fsS -o /dev/null -X PATCH https://hub.docker.com/v2/namespaces/veraxai/repositories/verax \
                -H 'Content-Type: application/json' --data @"$body" --config -
