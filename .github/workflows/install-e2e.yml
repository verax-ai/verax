# Elevated install of the body under another account, then a probe that
# is not that account. Windows runners are already Administrator.
# Linux uses sudo. macOS is not in this workflow.
name: install-e2e

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: system Node
        shell: pwsh
        run: |
          $node = "C:\Program Files\nodejs\node.exe"
          $need = -not (Test-Path $node)
          if (-not $need) {
            $ver = & $node -p "process.versions.node"
            Write-Host "node path: $node"
            & $node -v
            $parts = $ver.Split('.')
            if ([int]$parts[0] -lt 22 -or ([int]$parts[0] -eq 22 -and [int]$parts[1] -lt 6)) { $need = $true }
          }
          if ($need) {
            Write-Host "image Node is missing or older than 22.6; installing the official Node.js package for all users"
            $msi = Join-Path $env:RUNNER_TEMP "node-v22.20.0-x64.msi"
            Invoke-WebRequest -Uri "https://nodejs.org/dist/v22.20.0/node-v22.20.0-x64.msi" -OutFile $msi
            $proc = Start-Process msiexec.exe -ArgumentList @('/i', $msi, '/qn', '/norestart') -Wait -PassThru
            if ($proc.ExitCode -ne 0) { exit $proc.ExitCode }
            Write-Host "node path: $node"
            & $node -v
          }
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\nodejs"
      - run: npm ci
      - run: npm run build:dist
      - name: pack this pull request and lock the tarball directory
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "verax-tarballs"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          npm pack -w @verax-ai/inventory --pack-destination $dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm pack -w @verax-ai/proxy --pack-destination $dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm pack -w @verax-ai/body --pack-destination $dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          icacls $dir /inheritance:r /grant:r "*S-1-5-32-544:(OI)(CI)F" "*S-1-5-18:(OI)(CI)F" /T
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -Path $env:GITHUB_ENV -Value "VERAX_TARBALLS=$dir"
      - name: install, probe, uninstall
        shell: pwsh
        run: |
          node packages/body/dist/cli.js install --from-tarballs $env:VERAX_TARBALLS --port 8801
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node -e "fetch('http://127.0.0.1:8801/healthz').then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $acl = icacls "$env:ProgramData\Verax\state" | Out-String
          $principals = @()
          foreach ($line in ($acl -split "`n")) {
            $trim = $line.Trim()
            $mark = $trim.IndexOf(":(")
            if ($mark -lt 0) { continue }
            if ($trim -match '^Successfully processed') { continue }
            $left = $trim.Substring(0, $mark).Trim()
            $prefix = "$env:ProgramData\Verax\state"
            if ($left.StartsWith($prefix)) { $left = $left.Substring($prefix.Length).Trim() }
            if ($left -ne "") { $principals += $left }
          }
          $allowed = @('NT AUTHORITY\LOCAL SERVICE', 'BUILTIN\Administrators', 'NT AUTHORITY\LOCALSERVICE', 'LOCAL SERVICE', 'Administrators')
          foreach ($p in $principals) {
            if ($allowed -notcontains $p) { Write-Error "unexpected principal: $p"; exit 1 }
          }
          if ($principals -notcontains 'NT AUTHORITY\LOCAL SERVICE' -and $principals -notcontains 'LOCAL SERVICE') { Write-Error "LocalService missing"; exit 1 }
          $pass = -join ((1..20) | ForEach-Object { '{0:x}' -f (Get-Random -Maximum 16) }) + 'Aa1'
          net user veraxprobe $pass /add
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sec = ConvertTo-SecureString $pass -AsPlainText -Force
          $cred = New-Object System.Management.Automation.PSCredential('veraxprobe', $sec)
          $node = (Get-Command node).Source
          $script = Join-Path $env:PUBLIC 'verax-probe.mjs'
          $tokenSrc = Join-Path $env:USERPROFILE '.verax\agent.token'
          $tokenDst = Join-Path $env:PUBLIC 'verax-agent.token'
          Copy-Item $tokenSrc $tokenDst -Force
          icacls $tokenDst /grant 'veraxprobe:(R)' | Out-Null
          @'
          import { appendFileSync, readFileSync, writeFileSync } from "node:fs";
          const state = process.env.PROGRAMDATA + "\\Verax\\state";
          const code = process.env.PROGRAMFILES + "\\Verax\\probe-write";
          const token = readFileSync(process.env.PUBLIC + "\\verax-agent.token", "utf8").trim();
          function denied(fn) { try { fn(); return false; } catch { return true; } }
          if (!denied(() => readFileSync(state + "\\keys\\record.private.pem"))) process.exit(2);
          if (!denied(() => appendFileSync(state + "\\approval-commands.jsonl", "x\n"))) process.exit(3);
          if (!denied(() => writeFileSync(code, "x"))) process.exit(4);
          const res = await fetch("http://127.0.0.1:8801/mcp", {
            method: "POST",
            headers: {
              "content-type": "application/json",
              accept: "application/json, text/event-stream",
              authorization: "Bearer " + token,
            },
            body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: "tools/list", params: {} }),
          });
          if (res.status !== 200) process.exit(5);
          '@ | Set-Content -Encoding utf8 $script
          $p = Start-Process -FilePath $node -ArgumentList @($script) -Credential $cred -Wait -PassThru -WorkingDirectory $env:PUBLIC
          if ($p.ExitCode -ne 0) { Write-Error "probe exit $($p.ExitCode)"; exit $p.ExitCode }
      - name: second run refuses a state dir the probe user pre-created
        shell: pwsh
        run: |
          node packages/body/dist/cli.js uninstall
          if (Test-Path "$env:ProgramData\Verax") { Remove-Item -Recurse -Force "$env:ProgramData\Verax" }
          if (Test-Path "$env:ProgramFiles\Verax") { Remove-Item -Recurse -Force "$env:ProgramFiles\Verax" }
          $pass = -join ((1..20) | ForEach-Object { '{0:x}' -f (Get-Random -Maximum 16) }) + 'Aa1'
          net user veraxprobe $pass
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sec = ConvertTo-SecureString $pass -AsPlainText -Force
          $cred = New-Object System.Management.Automation.PSCredential('veraxprobe', $sec)
          $mk = Join-Path $env:PUBLIC 'verax-precreate.ps1'
          @'
          New-Item -ItemType Directory -Force -Path (Join-Path $env:ProgramData 'Verax\state') | Out-Null
          '@ | Set-Content -Encoding utf8 $mk
          $pre = Start-Process -FilePath 'powershell.exe' -ArgumentList @('-NoProfile','-File',$mk) -Credential $cred -Wait -PassThru -WorkingDirectory $env:PUBLIC
          if ($pre.ExitCode -ne 0) { Write-Error "pre-create exit $($pre.ExitCode)"; exit $pre.ExitCode }
          $log = & node packages/body/dist/cli.js install --from-tarballs $env:VERAX_TARBALLS --port 8801 2>&1 | Out-String
          if ($LASTEXITCODE -ne 78) { Write-Error "install exit $LASTEXITCODE, want 78: $log"; exit 1 }
          if ($log -notmatch 'was not created by verax install') { Write-Error "install did not name the pre-created directory: $log"; exit 1 }
      - name: uninstall
        if: always()
        shell: pwsh
        run: |
          node packages/body/dist/cli.js uninstall
          net user veraxprobe /delete
          Remove-Item -Force -ErrorAction SilentlyContinue "$env:PUBLIC\verax-probe.mjs","$env:PUBLIC\verax-agent.token","$env:PUBLIC\verax-precreate.ps1"
          exit 0

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: system Node
        run: |
          set -euo pipefail
          if [ -x /usr/bin/node ]; then NODE=/usr/bin/node
          elif [ -x /usr/local/bin/node ]; then NODE=/usr/local/bin/node
          else NODE=""; fi
          need=0
          if [ -z "$NODE" ]; then
            need=1
          else
            echo "node path: $NODE"
            "$NODE" -v
            if ! "$NODE" -e 'const [a,b]=process.versions.node.split(".").map(Number); if (a<22 || (a===22 && b<6)) process.exit(1)'; then
              need=1
            fi
          fi
          if [ "$need" = 1 ]; then
            echo "image Node is missing or older than 22.6; installing the official Node.js package for all users"
            curl -fsSL https://nodejs.org/dist/v22.20.0/node-v22.20.0-linux-x64.tar.gz -o /tmp/node.tar.gz
            sudo tar -C /usr/local --strip-components=1 -xzf /tmp/node.tar.gz
            NODE=/usr/local/bin/node
            echo "node path: $NODE"
            "$NODE" -v
          fi
          echo "$(dirname "$NODE")" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run build:dist
      - name: pack this pull request and lock the tarball directory
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/verax-tarballs"
          mkdir -p "$dir"
          npm pack -w @verax-ai/inventory --pack-destination "$dir"
          npm pack -w @verax-ai/proxy --pack-destination "$dir"
          npm pack -w @verax-ai/body --pack-destination "$dir"
          sudo chown -R root:root "$dir"
          sudo chmod -R a-w,u+rX "$dir"
          echo "VERAX_TARBALLS=$dir" >> "$GITHUB_ENV"
      - name: install and probe as the invoking user
        run: |
          set -euo pipefail
          # sudo sets SUDO_USER to the invoking account (runner on this job).
          sudo -E env "PATH=$PATH" node packages/body/dist/cli.js install --from-tarballs "$VERAX_TARBALLS" --port 8801
          curl -fsS http://127.0.0.1:8801/healthz >/dev/null
          if cat /var/lib/verax/keys/record.private.pem; then echo "private key was readable"; exit 1; fi
          if echo x >> /var/lib/verax/approval-commands.jsonl; then echo "approval log was writable"; exit 1; fi
          if touch /opt/verax/probe-write; then echo "code dir was writable"; exit 1; fi
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const token = readFileSync(process.env.HOME + "/.verax/agent.token", "utf8").trim();
            const res = await fetch("http://127.0.0.1:8801/mcp", {
              method: "POST",
              headers: {
                "content-type": "application/json",
                accept: "application/json, text/event-stream",
                authorization: "Bearer " + token,
              },
              body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: "tools/list", params: {} }),
            });
            if (res.status !== 200) process.exit(1);
          '
          set +e
          node packages/body/dist/cli.js approve probe-ref
          code=$?
          set -e
          test "$code" = "77"
          sudo -E env "PATH=$PATH" node packages/body/dist/cli.js uninstall
      - name: uninstall
        if: always()
        run: sudo -E env "PATH=$PATH" node packages/body/dist/cli.js uninstall || true
