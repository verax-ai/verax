name: Platform report
description: You ran Verax on a platform that docs/PLATFORMS.md does not list. Tell us what worked and what did not.
body:
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system, version and architecture, for example "Fedora 41 x64" or "Windows 11 ARM64".
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      description: Output of `node --version`.
    validations:
      required: true
  - type: checkboxes
    id: steps
    attributes:
      label: What you ran
      options:
        - label: npx @verax-ai/body demo
        - label: verax init --local <dir>
        - label: verax serve --env-file <dir>/verax.env
        - label: one tool call from an MCP client
        - label: verax verify <state dir>
  - type: textarea
    id: output
    attributes:
      label: What it printed
      description: The demo output and the last lines of verax verify. Leave tokens and keys out.
      render: text
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything that did not work
