# Version updates, once a month. The actions come as one pull request and the
# two base images as one. npm minor and patch updates come as one; an npm major
# version comes on its own. Security updates are separate and come as soon as
# an advisory is published; this file does not slow them down. A release has to
# be a week old before it is proposed, so one that turns out bad has time to
# be withdrawn. Nothing merges by itself: every pull request runs the required
# checks and waits for a maintainer.
version: 2
updates:
  # Actions stay pinned to a commit; the version comment beside it moves too.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # One lockfile at the root covers the workspaces. Minor and patch updates
  # come together; a major version comes alone, so it is read alone.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Both images build on the same Node base, pinned by digest.
  - package-ecosystem: docker
    directories:
      - /
      - /examples/docker-oidc/idp
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      base-image:
        patterns: ["*"]
    # The images stay on the Node line they were built and tested on. A new
    # major version of Node is a decision someone makes, not an update.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
